name: Pre-PR Media Foundation output lifetime verification

on:
  push:
    branches:
      - fix/media-foundation-output-sample-lifetime

permissions:
  contents: read

env:
  SOLUTION_PATH: SonicDesktopRelay.sln
  CONFIGURATION: Release

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore solution
        run: dotnet restore $env:SOLUTION_PATH
      - name: Build solution
        run: dotnet build $env:SOLUTION_PATH --configuration $env:CONFIGURATION --no-restore
      - name: Run release publishing helper tests
        shell: pwsh
        run: ./tests/Publish-GitHubRelease.Tests.ps1
      - name: Run full test suite
        run: dotnet test $env:SOLUTION_PATH --configuration $env:CONFIGURATION --no-build --no-restore
